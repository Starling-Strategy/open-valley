name: Research search lifecycle
on:
  pull_request:
    paths: ['web/**', 'scripts/school_board/**', 'deploy/research/**', '.github/workflows/research-search.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pgvector-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --include=dev
        working-directory: web
      - run: node --test scripts/test-research-index.mjs
        working-directory: web
        env:
          RESEARCH_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
