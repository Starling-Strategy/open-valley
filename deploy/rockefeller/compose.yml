name: openvalley-production
services:
  database:
    image: openvalley-production-db:pg16-peer-v1
    build:
      context: .
      dockerfile: Dockerfile.database
    restart: unless-stopped
    network_mode: none
    environment:
      PGHOST: /socket
    command:
      - postgres
      - -c
      - listen_addresses=
      - -c
      - unix_socket_directories=/socket
      - -c
      - unix_socket_permissions=0777
      - -c
      - hba_file=/etc/openvalley/pg_hba.conf
      - -c
      - ident_file=/etc/openvalley/pg_ident.conf
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
    volumes:
      - database:/var/lib/postgresql/data
      - ${OPENVALLEY_PRODUCTION_ROOT:?Set production root}/socket:/socket
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h /socket -U postgres']
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web:
    image: ${OPENVALLEY_WEB_IMAGE:?Set tested image tag or digest}
    user: '10001:10001'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 128
    mem_limit: 768m
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    ports:
      - '127.0.0.1:3461:3000'
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      NEXT_TELEMETRY_DISABLED: '1'
      SCHOOL_BOARD_ROOT: /collection
      SCHOOLS_DATABASE_URL: postgresql://schools_runtime@localhost/openvalley_schools?host=/socket
      RESEARCH_DATABASE_URL: postgresql://research_reader@localhost/openvalley_research?host=/socket
      OPENVALLEY_PREVIEW_ORIGIN: https://openvalley.maconphillips.com
      OPENVALLEY_PREVIEW_CHAT: ${OPENVALLEY_CHAT_ENABLED:-false}
      OPENVALLEY_PERSISTENT_LIMITS: 'true'
      OPENVALLEY_CHAT_API_KEY: ${OPENVALLEY_CHAT_API_KEY:-}
      OPENVALLEY_CHAT_MODEL: openai/gpt-5.4-mini
      OPENVALLEY_SUBSTACK_URL: https://openvalley.substack.com
    volumes:
      - ${OPENVALLEY_PRODUCTION_ROOT:?Set production root}/collection:/collection:ro
      - ${OPENVALLEY_PRODUCTION_ROOT:?Set production root}/socket:/socket:ro
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  database:
