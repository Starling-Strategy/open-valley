name: Documentation Protection

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    name: Documentation Links and Contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check maintained entry points
        run: python3 -B scripts/check_docs.py
      - name: Check changed Markdown and plan frontmatter
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -B scripts/check_docs.py --base "origin/$BASE_REF"
