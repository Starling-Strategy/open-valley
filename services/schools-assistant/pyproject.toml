[project]
name = "schools-assistant"
version = "0.1.0"
description = "Grounded question answering over the active Open Valley Schools publication"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bm25s>=0.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-ai-slim[openai]>=1.0",
    "pydantic-settings>=2.5",
    "uvicorn>=0.30",
]

[project.scripts]
schools-assistant = "schools_assistant.api:main"

[dependency-groups]
dev = [
    "pydantic-evals>=1.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
