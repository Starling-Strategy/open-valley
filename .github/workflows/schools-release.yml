name: Schools publication lifecycle

on:
  pull_request:
    paths:
      - 'db/schools/**'
      - 'scripts/school_board/**'
      - 'data/school-board/**'
      - 'web/**'
      - 'deploy/**'
      - 'docs/school-board/publication.md'
      - '.github/workflows/schools-release.yml'
  push:
    branches: [main]
    paths:
      - 'db/schools/**'
      - 'scripts/school_board/**'
      - 'data/school-board/**'
      - 'web/**'
      - 'deploy/**'
      - 'docs/school-board/publication.md'
      - '.github/workflows/schools-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --include=dev
        working-directory: web
      - name: Exercise migration, publication, withdrawal and runtime roles
        run: node --test scripts/school_board/test_publication.mjs
        env:
          SCHOOLS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - run: node --test scripts/school_board/test_credentials.mjs
      - run: npm run test:unit && npm run lint && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build the allowlisted standalone image
        run: docker build -f deploy/Dockerfile.web -t openvalley-schools-test .
      - name: Verify production browser flows and withdrawn HTML/RSC/JSON
        run: node --test scripts/school_board/test_serving.mjs
        env:
          SCHOOLS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          SCHOOLS_TEST_IMAGE: openvalley-schools-test
