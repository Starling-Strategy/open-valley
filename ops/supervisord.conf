; Combined release process manager for the Open Valley public service.
;
; Two programs run in one container:
;   api  - the read-only public API, bound to loopback only
;   web  - the Next.js server, the sole process reachable from outside
;
; The web server proxies /api/baseline requests to the API, so browser traffic
; stays same-origin. The API is never bound to a public interface.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:api]
command=/app/.venv/bin/uvicorn src.warren_baseline.app:app --host 127.0.0.1 --port 8998
directory=/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/node /app/web/node_modules/next/dist/bin/next start -H 0.0.0.0 -p 3000
directory=/app/web
environment=INTERNAL_BASELINE_API_URL="http://127.0.0.1:8998",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
