http:
  routers:
    openvalley-rebuild-maintenance:
      rule: Host(`openvalley.maconphillips.com`)
      entryPoints:
        - https
      priority: 10000
      tls: {}
      service: openvalley-rebuild-maintenance
    openvalley-rebuild-maintenance-http:
      rule: Host(`openvalley.maconphillips.com`)
      entryPoints:
        - http
      priority: 10000
      middlewares:
        - openvalley-rebuild-https
      service: openvalley-rebuild-maintenance
  middlewares:
    openvalley-rebuild-https:
      redirectScheme:
        scheme: https
        permanent: true
  services:
    openvalley-rebuild-maintenance:
      loadBalancer:
        servers:
          - url: http://100.75.27.44:3401
